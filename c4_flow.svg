<svg width="680" viewBox="0 0 680 500" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff;font-family:sans-serif">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- Column headers -->
<text font-size="14" font-weight="500" fill="#1a1a1a" x="170" y="30" text-anchor="middle">Experiment A</text>
<text font-size="14" font-weight="500" fill="#1a1a1a" x="510" y="30" text-anchor="middle">Experiment C4</text>
<line x1="340" y1="10" x2="340" y2="490" stroke="#cccccc" stroke-width="1" stroke-dasharray="4 4"/>

<!-- LEFT COLUMN -->
<!-- Step 1 -->
<rect x="60" y="50" width="220" height="44" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.5"/>
<text font-size="14" font-weight="500" fill="#2c2c2a" x="170" y="69" text-anchor="middle" dominant-baseline="central">Sample arrives in batch</text>
<text font-size="12" fill="#444441" x="170" y="85" text-anchor="middle" dominant-baseline="central">e.g. generated by Bob</text>
<line x1="170" y1="94" x2="170" y2="122" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Step 2 -->
<rect x="60" y="124" width="220" height="44" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
<text font-size="14" font-weight="500" fill="#085041" x="170" y="143" text-anchor="middle" dominant-baseline="central">True cluster ID passed</text>
<text font-size="12" fill="#0f6e56" x="170" y="159" text-anchor="middle" dominant-baseline="central">cluster = 1 (Bob)</text>
<line x1="170" y1="168" x2="170" y2="196" stroke="#0f6e56" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Step 3 -->
<rect x="60" y="198" width="220" height="44" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
<text font-size="14" font-weight="500" fill="#085041" x="170" y="217" text-anchor="middle" dominant-baseline="central">Bob reference value updated</text>
<text font-size="12" fill="#0f6e56" x="170" y="233" text-anchor="middle" dominant-baseline="central">with Bob's U-rewards</text>
<line x1="170" y1="242" x2="170" y2="270" stroke="#0f6e56" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Step 4 -->
<rect x="60" y="272" width="220" height="44" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
<text font-size="14" font-weight="500" fill="#085041" x="170" y="291" text-anchor="middle" dominant-baseline="central">Margin vs z₁</text>
<text font-size="12" fill="#0f6e56" x="170" y="307" text-anchor="middle" dominant-baseline="central">m = r − z_Bob</text>
<line x1="170" y1="316" x2="170" y2="344" stroke="#0f6e56" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Step 5 -->
<rect x="60" y="346" width="220" height="56" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="0.5"/>
<text font-size="14" font-weight="500" fill="#26215c" x="170" y="367" text-anchor="middle" dominant-baseline="central">Margin near 0</text>
<text font-size="12" fill="#534ab7" x="170" y="383" text-anchor="middle" dominant-baseline="central">z_Bob ≈ Bob's reward regime</text>
<text font-size="12" fill="#534ab7" x="170" y="397" text-anchor="middle" dominant-baseline="central">gradient weight stays alive</text>

<!-- Bottom labels -->
<text font-size="12" fill="#444441" x="170" y="448" text-anchor="middle">Reference value tracks Bob</text>
<text font-size="12" fill="#444441" x="170" y="464" text-anchor="middle">→ structural calibration</text>

<!-- RIGHT COLUMN -->
<!-- Step 1 -->
<rect x="400" y="50" width="220" height="44" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.5"/>
<text font-size="14" font-weight="500" fill="#2c2c2a" x="510" y="69" text-anchor="middle" dominant-baseline="central">Sample arrives in batch</text>
<text font-size="12" fill="#444441" x="510" y="85" text-anchor="middle" dominant-baseline="central">e.g. generated by Bob</text>
<line x1="510" y1="94" x2="510" y2="122" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Step 2 -->
<rect x="400" y="124" width="220" height="44" rx="8" fill="#faece7" stroke="#993c1d" stroke-width="0.5"/>
<text font-size="14" font-weight="500" fill="#4a1b0c" x="510" y="143" text-anchor="middle" dominant-baseline="central">Random cluster ID assigned</text>
<text font-size="12" fill="#993c1d" x="510" y="159" text-anchor="middle" dominant-baseline="central">cluster = 0 (Alice) — wrong</text>
<line x1="510" y1="168" x2="510" y2="196" stroke="#993c1d" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Step 3 -->
<rect x="400" y="198" width="220" height="44" rx="8" fill="#faece7" stroke="#993c1d" stroke-width="0.5"/>
<text font-size="14" font-weight="500" fill="#4a1b0c" x="510" y="217" text-anchor="middle" dominant-baseline="central">Alice reference value updated</text>
<text font-size="12" fill="#993c1d" x="510" y="233" text-anchor="middle" dominant-baseline="central">with Bob's U-rewards</text>
<line x1="510" y1="242" x2="510" y2="270" stroke="#993c1d" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Step 4 -->
<rect x="400" y="272" width="220" height="44" rx="8" fill="#faece7" stroke="#993c1d" stroke-width="0.5"/>
<text font-size="14" font-weight="500" fill="#4a1b0c" x="510" y="291" text-anchor="middle" dominant-baseline="central">Margin vs z₀</text>
<text font-size="12" fill="#993c1d" x="510" y="307" text-anchor="middle" dominant-baseline="central">m = r − z_mixed</text>
<line x1="510" y1="316" x2="510" y2="344" stroke="#993c1d" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Step 5 -->
<rect x="400" y="346" width="220" height="56" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.5"/>
<text font-size="14" font-weight="500" fill="#2c2c2a" x="510" y="367" text-anchor="middle" dominant-baseline="central">References become global z</text>
<text font-size="12" fill="#5f5e5a" x="510" y="383" text-anchor="middle" dominant-baseline="central">z₀ ≈ z₁ ≈ pooled mean</text>
<text font-size="12" fill="#5f5e5a" x="510" y="397" text-anchor="middle" dominant-baseline="central">CPO ≡ KTO</text>

<!-- Bottom labels -->
<text font-size="12" fill="#444441" x="510" y="448" text-anchor="middle">Reference values track mixtures</text>
<text font-size="12" fill="#444441" x="510" y="464" text-anchor="middle">→ no calibration gain</text>
</svg>
